<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Countries</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>
    <main class="py-4">
      <div class="container">
        <h1 class="text-center">Countries</h1>
        <div class="table-responsive border">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Region ID</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="con_table"></tbody>
          </table>
        </div>
        <!-- Modal trigger button -->
        <button
          type="button"
          class="btn btn-primary btn-lg"
          data-bs-toggle="modal"
          data-bs-target="#modalId"
          onclick="prepAdd()"
        >
          Add Country
        </button>

        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div
          class="modal fade"
          id="modalId"
          tabindex="-1"
          role="dialog"
          aria-labelledby="modalTitleId"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
            role="document"
          >
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalTitleId">Add Country</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form id="cont_data">
                  <div class="mb-3 row">
                    <label class="col-6 col-form-label">Country ID</label>
                    <div class="col-6">
                      <input
                        type="text"
                        class="form-control"
                        name="country_id"
                        id="country_id"
                      />
                    </div>
                  </div>
                  <div class="mb-3 row">
                    <label class="col-6 col-form-label">Country Name</label>
                    <div class="col-6">
                      <input
                        type="text"
                        class="form-control"
                        name="country_name"
                        id="country_name"
                      />
                    </div>
                  </div>
                  <div class="mb-3 row">
                    <label class="col-6 col-form-label">Region ID</label>
                    <div class="col-6">
                      <input
                        type="number"
                        class="form-control"
                        name="region_id"
                        id="region_id"
                      />
                    </div>
                  </div>
                  <div class="mb-3 row">
                    <div class="offset-sm-4 col-sm-8">
                      <button type="submit" class="btn btn-primary">
                        Save
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
        let editingId = null;
      const URL = "http://localhost:3000/countries";

      async function getCon() {
        const response = await fetch(URL);
        const countries = await response.json();

        const tbody = document.getElementById("con_table");
        tbody.innerHTML = countries
          .map(
            (country) => `
                 <tr>
                    <td>${country.country_id}</td>
                    <td>${country.country_name}</td>
                    <td>${country.region_id}</td>
                    <td>
                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="editCont('${country.country_id}','${country.country_name}',${country.region_id})"
                    >
                        Edit
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="deleteCont('${country.country_id}')"
                    >
                        Delete
                    </button>
                </td>
                </tr>
        `,
          )
          .join("");
      }

      getCon();

      document
        .getElementById("cont_data")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const data = {
            country_id: document.querySelector("[name=country_id]").value,
            country_name: document.querySelector("[name=country_name]").value,
            region_id: document.querySelector("[name=region_id]").value,
          };
          if(editingId == null){
              await fetch("http://localhost:3000/countries", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              });
              getCon();
              alert("Country added");
          }else{
                await fetch(`${URL}/${editingId}`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              });
              getCon();
              alert("Country Updated");
          }
        });

        function prepAdd(){
            editingId = null;
            document.getElementById("cont_data").reset();

            document.getElementById("country_id").diabled = false;

            document.getElementById("modalTitleId").textContent = "Add Country"
        };

        async function deleteCont(id){
            const confrim = confirm("Are your sure you want to delete?");

            if(!confrim) {
                return;
            }

            await fetch(`${URL}/${id}`,
                {method : "DELETE",}
            );
            alert("Country Delete.");
        }

        async function editCont(id, c_name, r_id){
            editingId = id;
            document.getElementById("country_id").value = id;
            document.getElementById("country_name").value = c_name;
            document.getElementById("region_id").value = r_id;

            document.getElementById("country_id").diabled = true;

            document.getElementById("modalTitleId").textContent = "Edit Country"

            const modal = new bootstrap.Modal(document.getElementById("modalId"))

            modal.show();
        }
    </script>
  </body>
</html>
