<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Analytics</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>
    <main>
        <div class="container py-5">
  <h2 class="text-center mb-4">Employees per Department</h2>

  <div class="d-flex justify-content-center">
    <canvas id="deptChart" style="max-width: 500px;"></canvas>
  </div>
</div>
    </main>
    
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>

    <script>
const API = "http://localhost:3000/analytics/employee-per-dep";

async function loadChart() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    const labels = data.map(item => "Dept " + item.department_id);
    const values = data.map(item => item.count);

    const ctx = document.getElementById("deptChart");

    new Chart(ctx, {
      type: "pie",
      data: {
        labels: labels,
        datasets: [{
          label: "Employees",
          data: values,
          backgroundColor: [
            "red",
            "blue",
            "green",
            "orange",
            "purple",
            "cyan"
          ]
        }]
      },
      options: {
        responsive: true
      }
    });

  } catch (err) {
    console.log("Error loading chart:", err);
  }
}

loadChart();
</script>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
