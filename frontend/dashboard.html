<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>HR Dashboard</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
    .stat-card {
        border-radius: 18px;
        transition: all 0.2s ease-in-out;
        min-height: 180px;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        background-color:#f8f6f6
    }
</style>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>
    <main class="py-4">
  <div class="container">

    <div class="row g-4">

      <!-- Employees -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
         onclick="window.location.href='employees.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-people fs-1 text-primary"></i>
            <h5 class="mt-3 text-muted">Employees</h5>
            <h1 id="emp" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

      <!-- Departments -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
        onclick="window.location.href='departments.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-building fs-1 text-success"></i>
            <h5 class="mt-3 text-muted">Departments</h5>
            <h1 id="dpt" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

      <!-- Jobs -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
        onclick="window.location.href='jobs.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-briefcase fs-1 text-warning"></i>
            <h5 class="mt-3 text-muted">Jobs</h5>
            <h1 id="jb" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

    </div>

    <div class="row g-4 mt-2">

      <!-- Regions -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
        onclick="window.location.href='regions.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-globe fs-1 text-danger"></i>
            <h5 class="mt-3 text-muted">Regions</h5>
            <h1 id="rg" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

      <!-- Countries -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
        onclick="window.location.href= 'countries.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-flag fs-1 text-info"></i>
            <h5 class="mt-3 text-muted">Countries</h5>
            <h1 id="count" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

      <!-- Locations -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 stat-card"
        onclick="window.location.href='locations.html'">
          <div class="card-body text-center py-3">
            <i class="bi bi-geo-alt fs-1 text-secondary"></i>
            <h5 class="mt-3 text-muted">Locations</h5>
            <h1 id="loc" class="fw-bold display-5">0</h1>
          </div>
        </div>
      </div>

    </div>

  </div>
</main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const URL = "http://localhost:3000/";

      async function getDetails() {
        const response = await fetch(URL);
        const data = await response.json();

        document.getElementById("emp").innerHTML = data[0].total_employees;
        document.getElementById("dpt").innerHTML = data[0].total_departments;
        document.getElementById("jb").innerHTML = data[0].totoal_jobs;
        document.getElementById("rg").innerHTML = data[0].total_regions;
        document.getElementById("count").innerHTML = data[0].total_countries;
        document.getElementById("loc").innerHTML = data[0].total_locations;
      }

      getDetails();
    </script>
  </body>
</html>
