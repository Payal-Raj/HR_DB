<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Employees</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>
    <main class="py-4">
      <div class="container-fluid">
        <h1 class="text-center">Employees</h1>
        <div class="table-responsive border">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone Number</th>
                <th scope="col">Hire Date</th>
                <th scope="col">Job ID</th>
                <th scope="col">Salary</th>
                <th scope="col">Commission Pct</th>
                <th scope="col">Manager ID</th>
                <th scope="col">Department ID</th>
              </tr>
            </thead>
            <tbody id="emp_table"></tbody>
          </table>
          <div>
            <button
              type="button"
              class="btn btn-success mb-4"
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
            >
              New Employee
            </button>
            <!-- Modal -->
            <div
              class="modal fade"
              id="staticBackdrop"
              data-bs-backdrop="static"
              data-bs-keyboard="false"
              tabindex="-1"
              aria-labelledby="staticBackdropLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-dialog-scrollable">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="staticBackdropLabel">
                      New Employee
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form action="/employees" method="POST" class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label">Employee ID</label>
                        <input
                          type="number"
                          name="employee_id"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">Hire Date</label>
                        <input
                          type="date"
                          name="hire_date"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input
                          type="text"
                          name="first_name"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input
                          type="text"
                          name="last_name"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-12">
                        <label class="form-label">Email</label>
                        <input
                          type="text"
                          name="email"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input
                          type="text"
                          name="phone_number"
                          class="form-control"
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">Job ID</label>
                        <input
                          type="text"
                          name="job_id"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input
                          type="number"
                          name="salary"
                          step="0.01"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-md-4">
                        <label class="form-label">Commission %</label>
                        <input
                          type="number"
                          name="commission_pct"
                          step="0.01"
                          class="form-control"
                        />
                      </div>

                      <div class="col-md-4">
                        <label class="form-label">Department ID</label>
                        <input
                          type="number"
                          name="department_id"
                          class="form-control"
                          required
                        />
                      </div>

                      <div class="col-12">
                        <label class="form-label">Manager ID</label>
                        <input
                          type="number"
                          name="manager_id"
                          class="form-control"
                        />
                      </div>

                      <div class="col-12">
                        <button
                          type="submit"
                          class="btn btn-success w-100 py-2"
                        >
                        Save
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const URL = "http://localhost:3000/employees";

      async function getemp() {
        const response = await fetch(URL);
        const employees = await response.json();

        const tbody = document.getElementById("emp_table");
        tbody.innerHTML = employees
          .map(
            (employee) => `
                 <tr>
                    <td>${employee.employee_id}</td>
                    <td>${employee.first_name}</td>
                    <td>${employee.last_name}</td>
                    <td>${employee.email}</td>
                    <td>${employee.phone_number}</td>
                    <td>${employee.hire_date}</td>
                    <td>${employee.job_id}</td>
                    <td>${employee.salary}</td>
                    <td>${employee.commission_pct}</td>
                    <td>${employee.manager_id}</td>
                    <td>${employee.department_id}</td>
                </tr>
        `,
          )
          .join("");
      }

      getemp();
    </script>
  </body>
</html>
