<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Jobs</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>

    <main class="py-4">
      <div class="container">
        <h1 class="text-center">Jobs</h1>
        <div class="table-responsive border">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Minimum Salary</th>
                <th scope="col">Maximum Salary</th>
              </tr>
            </thead>
            <tbody id="job_table"></tbody>
          </table>
        </div>
        <!-- Modal trigger button -->
        <button
            type="button"
            class="btn btn-primary btn-lg"
            data-bs-toggle="modal"
            data-bs-target="#modalId"
        >
            Add Job
        </button>
        
        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div
            class="modal fade"
            id="modalId"
            tabindex="-1"
            role="dialog"
            aria-labelledby="modalTitleId"
            aria-hidden="true"
        >
            <div
                class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
                role="document"
            >
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitleId">
                           Add Job
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <form id="job_data">
                        <div class="mb-3">
                            <label  class="form-label">Job ID</label>
                            <input
                                type="text"
                                class="form-control"
                                name="job_id"
                            />
                        </div>
                        <div class="mb-3">
                            <label  class="form-label">Job Title</label>
                            <input
                                type="text"
                                class="form-control"
                                name="job_title"
                            />
                        </div>
                        <div class="mb-3">
                            <label  class="form-label">Min_salary</label>
                            <input
                                type="text"
                                class="form-control"
                                name="min_salary"
                            />
                        </div>
                        <div class="mb-3">
                            <label  class="form-label">max_salary</label>
                            <input
                                type="text"
                                class="form-control"
                                name="max_salary"
                            />
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save
                        </button>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
        
        <!-- Optional: Place to the bottom of scripts -->
        <script>
            const myModal = new bootstrap.Modal(
                document.getElementById("modalId"),
                options,
            );
        </script>
        
      </div>
    </main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const URL = "http://localhost:3000/jobs";

      async function getJobs() {
        const response = await fetch(URL);
        const jobs = await response.json();

        const tbody = document.getElementById("job_table");
        tbody.innerHTML = jobs
          .map(
            (job) => `
                <tr>
                    <td>${job.job_id}</td>
                    <td>${job.job_title}</td>
                    <td>${job.min_salary}</td>
                    <td>${job.max_salary}</td>
                </tr>
            `,
          )
          .join("");
      }
      getJobs();

      document.getElementById("job_data").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {
            job_id: document.querySelector("[name=job_id]").value,
            job_title: document.querySelector("[name=job_title]").value,
            min_salary: document.querySelector("[name=min_salary]").value,
            max_salary: document.querySelector("[name=max_salary]").value,
        };
        await fetch("http://localhost:3000/jobs" ,
            {method:"POST",
                headers:{
                    "Content-type":"application/json"
                },
                body:JSON.stringify(data),
            }
        )
        getJobs();
        alert("Added succesfully");
      })
    </script>
  </body>
</html>
