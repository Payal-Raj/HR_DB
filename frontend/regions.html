<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Regions</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="dashboard.html">System Limited</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">
            Log out
          </button>
        </div>
      </nav>
    </header>
    <main class="py-4">
      <div class="container">
        <h1 class="text-center">Regions</h1>
        <div class="table-responsive border">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="rg_table"></tbody>
          </table>
        </div>
        <!-- Modal trigger button -->
        <button
          type="button"
          class="btn btn-primary btn-lg"
          data-bs-toggle="modal"
          data-bs-target="#modalId"
          onclick="prepareAdd()"
        >
          Add region
        </button>

        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div
          class="modal fade"
          id="modalId"
          tabindex="-1"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          role="dialog"
          aria-labelledby="modalTitleId"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
            role="document"
          >
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalTitleId">Add Region</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <form id="rg_data">
                <div class="mb-3">
                  <label class="form-label">Region ID</label>
                  <input
                    type="number"
                    class="form-control"
                    name="region_id"
                    id="region_id"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Region Name</label>
                  <input
                    type="text"
                    class="form-control"
                    name="region_name"
                    id="region_name"
                  />
                </div>

                <button type="submit" class="btn btn-success w-100">
                  Save
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <strong>EMS Dashboard</strong><br />
          <small>QueryQuest Project</small>
        </div>

        <div class="text-end">
          <small>© 2026 System Limited</small>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      let editingId = null;
      const URL = "http://localhost:3000/regions";

      async function getrg() {
        const response = await fetch(URL);
        const regions = await response.json();

        const tbody = document.getElementById("rg_table");
        tbody.innerHTML = regions
          .map(
            (region) => `
                 <tr>
                    <td>${region.region_id}</td>
                    <td>${region.region_name}</td>
                    <td>
                        <button
                            class="btn btn-warning btn-sm"
                            onclick="editRegion(${region.region_id}, '${region.region_name}')"
                        >
                            Edit
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteRegion(${region.region_id})"
                        >
                            Delete
                        </button>
                    </td>
                </tr>
        `,
          )
          .join("");
      }

      getrg();

      document
        .getElementById("rg_data")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const region_id = document.getElementById("region_id").value;
          const region_name = document.getElementById("region_name").value;

          if (editingId === null) {
            // POST
            await fetch(URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                region_id,
                region_name,
              }),
            });

            alert("Region Added Successfully");
          } else {
            // PUT
            await fetch(`${URL}/${editingId}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                region_name,
              }),
            });

            alert("Region Updated Successfully");
          }

          getrg();
        });

      function editRegion(id, name) {
        editingId = id;

        document.getElementById("region_id").value = id;
        document.getElementById("region_name").value = name;

        document.getElementById("region_id").disabled = true;

        document.getElementById("modalTitleId").textContent = "Edit Region";

        const modal = new bootstrap.Modal(document.getElementById("modalId"));

        modal.show();
      }
      function prepareAdd() {
        editingId = null;

        document.getElementById("rg_data").reset();

        document.getElementById("region_id").disabled = false;

        document.getElementById("modalTitleId").textContent = "Add Region";
      }

      async function deleteRegion(id) {
        const confirmDelete = confirm(
          "Are you sure you want to delete this region?",
        );

        if (!confirmDelete) return;

        await fetch(`${URL}/${id}`, {
          method: "DELETE",
        });

        alert("Region Deleted Successfully");

        getrg();
      }
    </script>
  </body>
</html>
